    label: "Soft target"
    bomb_250: 1
    bomb_500: 1
    bomb_1000: 1
    bomb_2000: 1
    penetrator: 1
    cluster: 0.5
    sfw: 0.5
    missile_small: 1
    missile_large: 1
    atgm: 1
    rocket: 4
    rocket_heavy: 1
  light_armor:
    label: "Light armor"
    bomb_250: 1
    bomb_500: 1
    bomb_1000: 1
    bomb_2000: 1
    penetrator: 1
    cluster: 0.5
    sfw: 0.5
    missile_small: 1
    missile_large: 1
    atgm: 1
    rocket: 8
    rocket_heavy: 2
  armor:
