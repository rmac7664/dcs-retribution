# Desired weapon effects: how many weapons it takes to destroy one target.
#
# Rows are kinds of target, columns are kinds of weapon. Each number is the
# weapons needed for ONE target of that kind, assuming a guided weapon or an
# accurate delivery. A fraction means one weapon covers several targets (0.5 =
# one weapon per two targets). "-" means the weapon is not suited to the target.
#
# These are planning figures, not DCS damage values. Change any number here to
# match what you see in the game; no other file needs to change.

# Unguided bombs and unguided cluster bombs need this many times the figure.
unguided_factor: 2

weapons:
  bomb_250: "250 lb bomb"
  bomb_500: "500 lb bomb"
  bomb_1000: "1,000 lb bomb"
  bomb_2000: "2,000 lb bomb"
  penetrator: "Penetrator bomb"
  cluster: "Cluster bomb"
  sfw: "Sensor-fuzed cluster"
  missile_small: "Small missile (AGM-65D/H class)"
  missile_large: "Large missile (AGM-65F/G/K class)"
  atgm: "Anti-tank missile"
  rocket: "Rocket"
  rocket_heavy: "Heavy rocket"

targets:
