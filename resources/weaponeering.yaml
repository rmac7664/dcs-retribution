    bomb_250: 2
    bomb_500: 1
    bomb_1000: 1
    bomb_2000: 1
    penetrator: 1
    cluster: 2
    sfw: 0.5
    missile_small: 1
    missile_large: 1
    atgm: 1
    rocket: "-"
    rocket_heavy: 3
  small_building:
    label: "Small building"
    bomb_250: 2
    bomb_500: 1
    bomb_1000: 1
    bomb_2000: 1
    penetrator: 1
    cluster: "-"
    sfw: "-"
    missile_small: 2
    missile_large: 1
