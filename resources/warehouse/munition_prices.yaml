# Price of one munition, in the same budget units as aircraft and ground units
# (roughly millions of USD, scaled like the rest of Retribution's economy).
#
# Rules are matched in order against the warehouse item name with its category prefix
# removed (e.g. "AIM_120C" from "weapons.missiles.AIM_120C"), case-insensitively. The
# first matching pattern wins; anything unmatched uses the category default at the end.
# The campaign setting "Munition price multiplier" scales everything.
rules:
  # Long-range and strategic
  - { pattern: "AGM_158|JASSM|X_101|X_555|X_65|KH-?101|KH-?555|BGM_109|TOMAHAWK|SCALP|STORM|TAURUS|KEPD|YJ-?12|YJ-?83|X_59M|AGM_84H|AGM_84K|SLAM", price: 1.5 }
  - { pattern: "AGM_84|HARPOON|X_35|KH-?35|AM39|EXOCET|RB_?15|RBS_?15|C_802|C-802|YJ|P_?700|X_22|X_15|KSR|X_31A", price: 1.2 }
  - { pattern: "AIM_54|PHOENIX", price: 1.2 }
  - { pattern: "AGM_88|HARM|X_31P|X_58|X_25MP|ALARM|AGM_45|AGM_78|MARTEL|SHRIKE|LD-?10|CM-?102", price: 0.8 }
  # BVR air-to-air
