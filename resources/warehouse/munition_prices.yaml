  - { pattern: "AIM_9|AIM-9|SIDEWINDER|R_?60|P_60|R-?60|R_?13|K-?13|MAGIC|R550|PL-?[5-9]|SHAFRIR|RB_?24|RB_?74", price: 0.15 }
  # Precision air-to-ground
  - { pattern: "AGM_154|JSOW", price: 0.5 }
  - { pattern: "AGM_65|MAVERICK|X_29|KH-?29|X_25|KH-?25|X_38|RB_?75|AGM_12|AGM_62|WALLEYE|AS_?30|KAB_?1500|ALARM", price: 0.25 }
  - { pattern: "AGM_114|HELLFIRE|9M120|VIKHR|9M127|ATAKA|BGM_71|TOW|SPIKE|BRIMSTONE|AGR_20|APKWS|JAGM|HOT_?3|9M114|SHTURM|MOKOPA|KH-?66", price: 0.12 }
  - { pattern: "GBU_57|GBU_28|GBU_27|GBU_24|BLU_109|KAB_?500|KAB_?1500|GBU_15", price: 0.12 }
  - { pattern: "GBU_3[1-9]|GBU_54|GBU_10|GBU_16|GBU_12|GBU_|JDAM|LJDAM|PAVEWAY|LS_?6|GB-?6|AASM|HAMMER|KAB|LT_?2|LS-?6|GB_?6", price: 0.05 }
  - { pattern: "CBU_97|CBU_105|SFW", price: 0.35 }
  - { pattern: "CBU_|ROCKEYE|MK_?20|BL_?755|BLU_|RBK|BETAB|BAP|DURANDAL|BLG|BELOUGA|KMGU|SPPU", price: 0.03 }
